<!DOCTYPE html>
<html>
<head>
    <title>REFLECT.AI</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

    <!-- Header -->
    {% block navbar %}
    <div class="header">
        <div class="logo">REFLECT.AI</div>
        <button class="login-btn" onclick="window.location.href='{{ url_for('login') }}'">Login</button>
        <button class="register-btn" onclick="window.location.href='{{ url_for('register') }}'">Register</button>
        <button class="bookmark-btn" onclick="window.location.href='{{ url_for('bookmark') }}'">Bookmark</button>
    </div>
    {% endblock %}

    <!-- Flash messages -->
    <div class="container mt-3">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

    <!-- Page-specific content -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
